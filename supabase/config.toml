# Supabase Project Configuration for MyAngan
project_id = "myangan"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "auth"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://myangan.com"
additional_redirect_urls = ["https://myangan.vercel.app", "https://*.vercel.app"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "5MB"

[storage.buckets.property-images]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]
